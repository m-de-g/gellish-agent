[project]
name = "gellish-agent-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "httpx",
  "uvicorn[standard]",
  "sqlalchemy>=2.0",
  "alembic",
  "psycopg2-binary",
  "python-dotenv",
